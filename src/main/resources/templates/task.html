<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>タスク</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">
	<header th:replace="~{header}"></header>

</head>

<body>
	<main>
		<h1>タスク一覧</h1>
		<td>
			<form>

				<a href="/task" class="btn">全て</a>
				<a href="/task?categoryId=2" class="btn">日常</a>
				<a href="/task?categoryId=1" class="btn">仕事</a>

			</form>
		</td>

		<p>予想合計タスク時間: <span th:text="${sum}"></span>分</p>

		<table border="1">

			<tr>
				<th>タイトル</th>
				<th>進捗状況</th>
				<th>開始日</th>
				<th>期限</th>
				<th>想定時間</th>
				<th>メモ</th>
				<th colspan="4">操作</th>

			</tr>
			<tr th:each="task : ${tasks}">
				<td th:text="${task.title}"></td>
				<td th:switch="${task.progress}">
					<span th:case="1">完了</span>
					<span th:case="2">進行中</span>
					<span th:case="3">未着手</span>
					<span th:case="*">UNKNOWN</span>
				</td>
				
				<td th:text="${task.date}"></td>
				<td th:text="${task.closingDate}"></td>
				<td th:text="${task.time}+分"></td>
				<td th:text="${task.memo}"></td>
				<td>
					<a th:href="@{/tasks/{id}/edit(id=${task.taskId})}" class="btn">更新</a>
				</td>
				<td>
					<a th:href="@{/tasks/{id}/end(id=${task.taskId})}" class="btn">完了</a>
				</td>
				<td>
					<a th:href="@{/tasks/{id}/delete(id=${task.taskId})}" class="btn">削除</a>
<!--					<form th:action="@{/tasks/{id}/delete(id=${task.taskId})}" method="post">-->
<!--						<button>削除</button>-->
<!--					</form>-->
				</td>
			</tr>
			<tr>
				<form action="/tasks/create" method="get">
					<button>新規作成</button>
				</form>
			</tr>



		</table>

	</main>
	<hr>
	<footer th:replace="footer"></footer>
</body>

</html>
