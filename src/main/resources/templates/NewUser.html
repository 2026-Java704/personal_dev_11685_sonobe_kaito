<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>新規登録</title>
</head>
<body>
	<main>
		<h3>新規登録</h3>
		<form action="/users/add" method="post">
			<table border="1">
				<tr>
					<th>名前</th>
					<td>
						<input type="text" name="name"th:value="${name}">
					</td>
				</tr>
				<tr>
					<th>パスワード</th>
					<td>
						<input type="text" name="password">
					</td>
				</tr>
				<tr>
					<th>パスワード確認</th>
					<td>
						<input type="text" name="passwordConfirm">
					</td>
				</tr>
				
			</table>
			<button>登録</button>
		</form>
	</main>
	<hr>
</body>
</html>
