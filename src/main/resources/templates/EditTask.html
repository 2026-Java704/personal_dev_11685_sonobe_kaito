<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>タスク更新</title>

	<header th:replace="~{header}"></header>
</head>

<main>
	<h1>タスク更新</h1>
	<table border="1">
		<form th:action="@{/tasks/{id}/edit(id=${task.taskId})}" method="post" th:object="${form}">
			<link rel="stylesheet" type="text/css" href="/css/style.css">
			<div th:if="${errorList}">
				<ul>
					<li th:each="error : ${errorList}" th:text="${error}" style="color:red">
					</li>
				</ul>
			</div>
			<tr>
			    <th>カテゴリー</th>
			    <td>
			        <input type="radio" name="categoryId" value="1" th:checked="${task.categoryId == 1}" />
			        <label for="contactChoice1">仕事</label>
			        <input type="radio" name="categoryId" value="2" th:checked="${task.categoryId == 2}" />
			        <label for="contactChoice2">日常</label>
			    </td>
			</tr>
			<tr>
				<th>タイトル</th>
				<td>
					<input type="text" name="title" th:value="${task.title}">
				</td>
			</tr>
			<tr>
			    <th>進捗状況</th>
			    <td>
			        <div>
			            <input type="radio" name="progress" value="1" th:checked="${task.progress == 1}">
			            <label>完了</label>
			            <input type="radio" name="progress" value="2" th:checked="${task.progress == 2}">
			            <label>進行中</label>
			            <input type="radio" name="progress" value="3" th:checked="${task.progress == 3}">
			            <label>未着手</label>
			        </div>
			    </td>
			</tr>
			<tr>
				<th>タスク開始日</th>
				<td>
					<input type="date" name="date" th:value="${task.date}">
				</td>
			</tr>
			<tr>
				<th>期限</th>
				<td>
					<input type="date" name="closingDate" date th:value="${task.closingDate}">
				</td>
			</tr>
			<tr>
				<th>予想所要時間</th>
				<td>
					<input type="number" name="time" th:value="${task.time}">
				</td>
			</tr>
			<tr>
			    <th>メモ</th>
			    <td>
			        <textarea name="memo" maxlength="60" th:text="${task.memo}"></textarea>
			    </td>
			</tr>
	</table>
	<button>更新</button>
	<br> <span th:text="${message}" style="color: red"></span>
	</form>
	<footer th:replace="footer"></footer>
</main>
<hr>
