<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>新規タスク作成</title>
</head>

<body>
	<main>
		<h3>新規タスク作成</h3>

		<table border="1">
			<form action="/tasks/create" method="post">
				<tr>
					<input type="radio" name="categoryId" value="1" />
					<label for="contactChoice1">仕事</label>
				</tr>
				<tr>
					<input type="radio" name="categoryId" value="2" />
					<label for="contactChoice2">日常</label>
				</tr>
		
				<tr>
					<th>タイトル</th>
					<td>
						<input type="text" name="title">
					</td>
				</tr>
				<tr>
					<th>タスク開始日</th>
					<td>
						<input type="date" name="date">
					</td>
				</tr>
				<tr>
					<th>期限</th>
					<td>
						<input type="date" name="closingDate">
					</td>
				</tr>
				<tr>
					<th>予想所要時間</th>
					<td>
						<input type="text" name="time">
					</td>
				</tr>
				<tr>
					<th>メモ</th>
					<td>
						<input type="text" name="memo">
					</td>
				</tr>
		</table>
		<button>新規作成</button>
		</form>
	</main>
	<hr>
</body>

</html>
