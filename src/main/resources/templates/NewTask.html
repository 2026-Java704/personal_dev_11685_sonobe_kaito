<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>新規タスク作成</title>
</head>

<body>
	<main>
		<h3>新規タスク作成</h3>
		<form action="/task/create" method="post">
			<table border="1">
				<tr>
					<th>カテゴリ</th>
					<td>
						<input type="text" name="categoryId">
					</td>
				</tr>
				<tr>
					<th>タイトル</th>
					<td>
						<input type="text" name="title">
					</td>
				</tr>
				<tr>
					<th>タスク開始日</th>
					<td>
						<input type="date" name="date">
					</td>
				</tr>
				<tr>
					<th>期限</th>
					<td>
						<input type="text" name="closing_date">
					</td>
				</tr>
				<tr>
					<th>予想所要時間</th>
					<td>
						<input type="text" name="time">
					</td>
				</tr>
				<tr>
					<th>メモ</th>
					<td>
						<input type="text" name="memo">
					</td>
				</tr>

			</table>
			<button>新規作成</button>
		</form>
	</main>
	<hr>
</body>

</html>
